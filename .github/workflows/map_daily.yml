name: Interactive Map

on:
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build interactive map
        run: |
          python source_code/map/interactive-map-leaflet.py

      - name: Commit & push map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git pull origin main || true
          git add data_locations.html
          git commit -m "Update interactive map for $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin HEAD:main || true
