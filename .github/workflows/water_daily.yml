name: Daily Water Forecast Data

on:
  # Run once per day at 18:00 UTC, when NWPS stageflow
  # forecasts are typically available with initial valid
  # times near 18:00Z.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: water-data-update
  cancel-in-progress: true

jobs:
  fetch-water-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch list of continuous gauges
        run: |
          python source_code/water/continuous_gauges.py

      - name: Fetch water forecast data for gauges
        run: |
          python source_code/water/all_gauges.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git pull origin main || true
          git add data/water source_code/water/continuous_forecast_gauges.csv
          git commit -m "Update water data for $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin HEAD:main || true
